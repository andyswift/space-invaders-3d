<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05030a" />
    <title>Space Invaders 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05030a; overflow: hidden; overscroll-behavior: none; }
      /* the canvas fills the whole screen, including under notches (safe areas are handled in-game) */
      #stage { position: fixed; inset: 0; width: 100vw; height: 100dvh; }
      #game { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z" data-bin="space_invaders_3d" />
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>
  </body>
</html>
