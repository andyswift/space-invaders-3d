[package]
name = "space_invaders_3d"
version = "0.1.0"
edition = "2024"
description = "Space Invaders: The Upside Down Odyssey, in 3D (Rust + WebAssembly + Bevy)"

[dependencies]
# Lean feature set for the web: 3D + bloom + UI text. No audio engine, gltf, picking or desktop windowing.
bevy = { version = "0.18.1", default-features = false, features = [
  "default_app", "bevy_winit", "default_font", "std", "async_executor",
  "web", "debug",
  "common_api", "bevy_light", "tonemapping_luts", "ktx2", "zstd_rust",
  "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_post_process", "bevy_anti_alias",
  "ui_api", "ui_bevy_render",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# One build is either WebGL2 or WebGPU (Bevy can't ship both in one wasm). A loader picks at runtime.
[features]
default = ["webgl"]
webgl = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

# Dev builds: fast to compile the game, optimised dependencies (Bevy is slow unoptimised).
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Release builds: small wasm. (trunk then runs wasm-opt)
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
